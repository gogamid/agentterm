name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Materialize signing keystore
        if: env.AGENTTERM_KEYSTORE_B64 != ''
        env:
          AGENTTERM_KEYSTORE_B64: ${{ secrets.AGENTTERM_KEYSTORE_B64 }}
        run: echo "$AGENTTERM_KEYSTORE_B64" | base64 --decode > agentterm.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          AGENTTERM_KEYSTORE_PATH: ${{ github.workspace }}/agentterm.jks
          AGENTTERM_KEYSTORE_PASS: ${{ secrets.AGENTTERM_KEYSTORE_PASS }}
          AGENTTERM_KEY_ALIAS: ${{ secrets.AGENTTERM_KEY_ALIAS }}
        run: ./gradlew :core:test :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agentterm-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload core test report
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore